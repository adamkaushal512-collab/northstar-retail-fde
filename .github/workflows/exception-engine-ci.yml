name: Exception Engine CI

on:
  pull_request:
    paths:
      - "services/exception-engine/**"
      - "data/**"
      - ".github/workflows/exception-engine-ci.yml"
  push:
    branches: [main]
    paths:
      - "services/exception-engine/**"
      - "data/**"
      - ".github/workflows/exception-engine-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --upgrade "pytest==7.4.4"

      - name: Run exception-engine test suite
        working-directory: services/exception-engine
        env:
          PYTHONPATH: src
        run: python -m pytest tests -q
